# Schema minimal du knowledge graph.

node_types:
  Paper:
    description: Article scientifique, livre ou chapitre.
  Author:
    description: Auteur extrait de JabRef ou de GROBID.
  Section:
    description: Section d'un article extraite du TEI GROBID.
  Citation:
    description: Reference bibliographique citee par un papier.
  WebSource:
    description: Source web convertie en Markdown.
  DocumentationPage:
    description: Page de documentation ou URL source liee a un dataset, package ou papier.
  Dataset:
    description: Jeu de donnees retenu comme entite exploitable, typiquement avec artefact local, preuve source forte ou usage benchmark.
  DatasetCatalogRecord:
    description: Ligne de catalogue ou signal d'inventaire. Peut devenir un Dataset apres validation, conversion ou documentation.
  DatasetCandidate:
    description: Candidat dataset repere par une source, mais pas encore valide comme Dataset exploitable.
  DatasetArtifact:
    description: Artefact local lie a un dataset, par exemple un RDS final, un CSV exporte, un GeoJSON ou un bundle auxiliaire.
  BenchmarkDataset:
    description: Dataset utilise explicitement dans un benchmark ou pipeline de modelisation.
  DatasetBundle:
    description: Ensemble de fichiers ou objets auxiliaires associes a un jeu de donnees.
  AuxiliaryFile:
    description: Fichier auxiliaire qui complete un jeu de donnees principal.
  Variable:
    description: Variable detectee ou documentee dans un jeu de donnees.
  ResponseVariable:
    description: Variable candidate ou confirmee comme variable dependante.
  Covariate:
    description: Variable candidate comme covariable ou predicteur.
  CoordinateVariable:
    description: Variable jouant un role de coordonnee spatiale.
  GeometryColumn:
    description: Colonne geometrique ou type de geometrie.
  TimeVariable:
    description: Variable temporelle ou date.
  IdentifierVariable:
    description: Variable identifiant, code administratif ou cle.
  RPackage:
    description: Package R lie a un dataset ou une methode.
  PythonPackage:
    description: Package Python lie a un dataset ou une methode.
  SourceFamily:
    description: Famille de source comme software package, scientific literature ou data bank.
  Method:
    description: Methode statistique ou spatiale.
  Formula:
    description: Formule de modele ou specification empirique.
  Concept:
    description: Concept scientifique stable.
  WikiPage:
    description: Page de synthese du wiki.
  Evidence:
    description: Fragment de source qui justifie une relation.
  PaperDatasetUse:
    description: Usage d'un jeu de donnees par un papier, avec statut de validation, source, page/preuve, formule et caracterisation spatiale quand ces elements sont confirmes.

edge_types:
  USES_DATASET:
    from: Paper
    to: Dataset
  HAS_PAPER_DATASET_USE:
    from: Paper
    to: PaperDatasetUse
  RESOLVES_TO_DATASET:
    from: PaperDatasetUse
    to: Dataset | DatasetCatalogRecord | DatasetCandidate
  CANDIDATE_DATASET_USE:
    from: PaperDatasetUse
    to: Dataset | DatasetCatalogRecord | DatasetCandidate
  USES_PACKAGE:
    from: Paper
    to: RPackage
  PROVIDES_DATASET:
    from: RPackage | PythonPackage
    to: Dataset
  CATALOGS_DATASET_RECORD:
    from: RPackage | PythonPackage | SourceFamily
    to: DatasetCatalogRecord
  HAS_DATASET_CANDIDATE:
    from: RPackage | PythonPackage | Paper | SourceFamily
    to: DatasetCandidate
  MENTIONS_DATASET_RECORD:
    from: Paper
    to: DatasetCatalogRecord
  PROMOTES_TO_DATASET:
    from: DatasetCatalogRecord | DatasetCandidate
    to: Dataset
  HAS_LOCAL_ARTIFACT:
    from: Dataset
    to: DatasetArtifact
  USED_IN_BENCHMARK:
    from: BenchmarkDataset | Method
    to: Dataset
  HAS_VARIABLE:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate
    to: Variable
  HAS_RESPONSE:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate
    to: ResponseVariable
  HAS_COVARIATE:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate
    to: Covariate
  HAS_COORDINATE:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate
    to: CoordinateVariable
  HAS_GEOMETRY:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate
    to: GeometryColumn
  HAS_TIME:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate
    to: TimeVariable
  HAS_IDENTIFIER:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate
    to: IdentifierVariable
  HAS_AUXILIARY_FILE:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate
    to: AuxiliaryFile
  DOCUMENTED_BY:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate | RPackage | PythonPackage | Method
    to: DocumentationPage | WebSource
  BELONGS_TO_SOURCE_FAMILY:
    from: Dataset | DatasetCatalogRecord | DatasetCandidate | Paper | WebSource | DocumentationPage
    to: SourceFamily
  IMPLEMENTS:
    from: RPackage | PythonPackage
    to: Method
  MENTIONS_METHOD:
    from: Paper | PaperDatasetUse
    to: Method
  HAS_FORMULA:
    from: Paper
    to: Formula
  HAS_AUTHOR:
    from: Paper
    to: Author
  HAS_SECTION:
    from: Paper
    to: Section
  CITES:
    from: Paper
    to: Citation
  SUMMARIZES:
    from: WikiPage
    to: Paper
  SHOWS_FORMULA:
    from: WebSource | DocumentationPage
    to: Formula
  SUPPORTS:
    from: Evidence
    to: any
